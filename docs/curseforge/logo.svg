<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#2a3346"/>
      <stop offset="0.6" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.35" stop-color="#e8c25a"/>
      <stop offset="0.7" stop-color="#a87a22"/>
      <stop offset="1" stop-color="#6e4c12"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3346"/><stop offset="1" stop-color="#121621"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="red" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#ff7a6a"/><stop offset="0.6" stop-color="#d42a22"/><stop offset="1" stop-color="#7a0c0c"/>
    </radialGradient>
    <radialGradient id="blue" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#8ac6ff"/><stop offset="0.6" stop-color="#2f6fd8"/><stop offset="1" stop-color="#123a86"/>
    </radialGradient>
    <radialGradient id="green" cx="45%" cy="40%" r="65%">
      <stop offset="0" stop-color="#b8f07a"/><stop offset="0.6" stop-color="#4caa2c"/><stop offset="1" stop-color="#1f5a12"/>
    </radialGradient>
    <linearGradient id="bread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c27a"/><stop offset="1" stop-color="#9a5a22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- the bar: two rows of two slots, a collapse tab on the left -->
  <g filter="url(#shadow)">
    <rect x="96" y="104" width="352" height="304" rx="14" fill="url(#gold)"/>
    <rect x="104" y="112" width="336" height="288" rx="9" fill="#0d111a"/>
  </g>

  <!-- collapse tab -->
  <rect x="56" y="104" width="34" height="34" rx="6" fill="url(#gold)"/>
  <rect x="61" y="109" width="24" height="24" rx="4" fill="#1a1f2c"/>
  <rect x="66" y="119" width="14" height="4" rx="2" fill="#ffd35a"/>

  <!-- slots -->
  <g stroke="#6e4c12" stroke-width="3">
    <rect x="124" y="132" width="120" height="120" rx="10" fill="url(#slot)"/>
    <rect x="290" y="132" width="120" height="120" rx="10" fill="url(#slot)"/>
    <rect x="124" y="268" width="120" height="120" rx="10" fill="url(#slot)"/>
    <rect x="290" y="268" width="120" height="120" rx="10" fill="url(#slot)"/>
  </g>

  <!-- healing potion -->
  <g transform="translate(184 194)">
    <rect x="-9" y="-50" width="18" height="16" rx="3" fill="#c9a46a"/>
    <rect x="-7" y="-36" width="14" height="14" fill="#d8d8e8" opacity="0.8"/>
    <circle cx="0" cy="0" r="34" fill="url(#red)" stroke="#2a0606" stroke-width="3"/>
    <ellipse cx="-11" cy="-10" rx="10" ry="16" fill="url(#glass)"/>
  </g>
  <!-- mana potion -->
  <g transform="translate(350 194)">
    <rect x="-9" y="-50" width="18" height="16" rx="3" fill="#c9a46a"/>
    <rect x="-7" y="-36" width="14" height="14" fill="#d8d8e8" opacity="0.8"/>
    <circle cx="0" cy="0" r="34" fill="url(#blue)" stroke="#06122a" stroke-width="3"/>
    <ellipse cx="-11" cy="-10" rx="10" ry="16" fill="url(#glass)"/>
  </g>
  <!-- food: bread loaf -->
  <g transform="translate(184 330)">
    <path d="M-42 12 C-46 -18 -24 -34 0 -34 C24 -34 46 -18 42 12 Z" fill="url(#bread)" stroke="#4a2a0a" stroke-width="3"/>
    <rect x="-44" y="10" width="88" height="14" rx="5" fill="#b8763a" stroke="#4a2a0a" stroke-width="3"/>
    <path d="M-20 -22 L-12 -6 M0 -26 L6 -10 M20 -22 L24 -6" stroke="#fff0c8" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- flask -->
  <g transform="translate(350 330)">
    <rect x="-8" y="-50" width="16" height="12" rx="3" fill="#c9a46a"/>
    <path d="M-7 -38 L-7 -18 L-34 22 C-38 30 -32 36 -24 36 L24 36 C32 36 38 30 34 22 L7 -18 L7 -38 Z"
          fill="url(#green)" stroke="#0c2a06" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-20 18 L-6 -4" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- counts -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="30" fill="#ffffff"
     stroke="#000" stroke-width="5" paint-order="stroke" text-anchor="end">
    <text x="238" y="244">12</text>
    <text x="404" y="244">8</text>
    <text x="238" y="380">20</text>
    <text x="404" y="380">3</text>
  </g>

  <!-- pick arrow beside the mana potion -->
  <g filter="url(#glow)">
    <path d="M424 176 L444 192 L424 208 Z" fill="#ffd35a" stroke="#6e4c12" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
